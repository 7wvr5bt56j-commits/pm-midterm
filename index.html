* { box-sizing: border-box; -webkit-tap-highlight-color: transparent }

h3 { font-family: var(--f-display); font-size: 18px; margin: 18px 0 8px }
.eyebrow { margin: 0 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .09em; color: var(--accent); font-weight: 700 }
.top { display: grid; gap: 6px; padding-top: 8px }
.sub { margin: 0; color: var(--muted) }

.list { display: grid; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden }

.pill.good { background: var(--good-bg); color: var(--good) } .pill.mid { background: var(--mid-bg); color: var(--mid) } .pill.low { background: var(--bad-bg); color: var(--bad) }

.tile .tn { font-family: var(--f-display); font-weight: 700; font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums }
.tile .ts { font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums }
.tile .tt { font-size: 12px; color: var(--muted) }

.tile.mid { border-color: var(--mid); background: var(--mid-bg) } .tile.mid .ts { color: var(--mid) }

.big { font-family: var(--f-display); font-weight: 700; font-size: 56px; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums }

.learn th, .learn td, .brk th, .brk td, .nett th, .nett td { text-align: left; vertical-align: top; padding: 7px 8px; border-bottom: 1px solid var(--line) }
.learn th, .brk th, .nett th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600 }
.learn td:first-child { font-weight: 600 }

.qhead { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600 }
.qhead span:last-child { text-align: right; min-width: 0 }
.q { font-family: var(--f-display); font-size: clamp(19px, 5vw, 22px); font-weight: 650; line-height: 1.3; margin: 0; text-wrap: pretty }
.nett { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px 10px; overflow-x: auto; font-variant-numeric: tabular-nums }
.nett table { margin: 0 }
.nett tr:last-child td { border-bottom: 0 }
.opts { display: grid; gap: 10px }
.opt { display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; text-align: left; background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 13px 14px; cursor: pointer; font-size: 16px; line-height: 1.35; min-height: 54px }
.opt .k { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 14px }
.opt:disabled { cursor: default; opacity: 1 }
.opt.right { border-color: var(--good); background: var(--good-bg) } .opt.right .k { background: var(--good); color: var(--card) }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg) } .opt.wrong .k { background: var(--bad); color: var(--card) }
.why { display: grid; gap: 4px; border-radius: 12px; padding: 12px 14px; background: var(--good-bg); border: 1px solid var(--good); font-size: 15px }
.why.bad { background: var(--bad-bg); border-color: var(--bad) }
.result { display: grid; gap: 8px } .result p { margin: 0 }
.brk { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden }
.brk td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap }
.brk tr.weak td { color: var(--bad); font-weight: 600 }
.rh { margin-top: 8px }
.miss { display: grid; gap: 12px }
.miss > div { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--bad); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; min-width: 0 }
.miss p { margin: 0 } .miss .a { color: var(--muted); font-size: 14.5px }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: grid; grid-template-columns: repeat(3, 1fr); background: color-mix(in srgb, var(--card) 92%, transparent); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px) }
.tab { background: none; border: 0; height: var(--tabh); display: grid; place-items: center; align-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--muted); cursor: pointer }
.tab svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
.tab[aria-selected="true"] { color: var(--accent) }
@media (prefers-reduced-motion: reduce) { .meter i, .prog i { transition: none } }

<script>
// Content for the PM Midterm app (English).
// Question format: [question, [4 options], correctIndex, explanation]
// Keep question order stable: saved progress refers to "section#index".

const CHAPTERS = [
  { id: "k1", title: "Chapter 1", sub: "Fundamental concepts, governance, delivery approaches" },
  { id: "k2", title: "Chapter 2", sub: "Initiation and integrated project planning" }
];

const SECTIONS = [
/* ---------------------------------------------------------------- 1.1 */
{ id: "1.1", ch: "k1", title: "What is a project?",
learn: `
<p class="lead">A project is temporary, has a purpose and delivers a unique result.</p>
<div class="def"><span>Kleim &amp; Ludin (1998)</span>A project is a coherent set of activities carried out in a logical sequence to achieve a specific result.</div>
<h3>The 4 characteristics</h3>
<table><tr><th>Characteristic</th><th>Meaning</th></tr>
<tr><td>Purposeful</td><td>Responds to a need and has a final objective</td></tr>
<tr><td>Temporary</td><td>Has a beginning and an end</td></tr>
<tr><td>Methodical</td><td>Involves coordinating a set of activities</td></tr>
<tr><td>Cross-functional</td><td>Brings together members from different areas of expertise</td></tr></table>
<h3>The 3 dimensions: the "quality triangle"</h3>
<p>Scope (also called quality or perimeter), Time and Resources define the performance of a project. A project consists of building a reality <b>progressively and systematically</b>.</p>
<div class="trap"><b>Trap:</b> Most textbooks call this the "iron triangle" or "triple constraint". This course calls it the "quality triangle". Stakeholders, risk or cost are not one of the three dimensions here.</div>
<div class="mem"><b>Memory aid:</b> P-T-M-C = Purpose, Time, Method, Cross-functional. The opposite of all four is "repetitive".</div>`,
q: [
["Kleim and Ludin (1998): \"A project is a coherent set of activities carried out in a logical sequence to achieve ...\"",["a specific result","continuous profit","operational stability","a strategic portfolio"],0,"The definition ends with \"a specific result\". A project has a concrete, one-off objective."],
["Which of the following is NOT a characteristic of a project according to the course?",["Purposeful","Temporary","Repetitive","Cross-functional"],2,"The four characteristics are Purposeful, Temporary, Methodical and Cross-functional. Repetitive describes operations."],
["Which characteristic means that a project brings together members from different areas of expertise?",["Methodical","Cross-functional","Purposeful","Temporary"],1,"Cross-functional = different areas of expertise. Methodical = coordinating activities."],
["\"A project responds to a need and has a final objective.\" Which characteristic is this?",["Purposeful","Methodical","Temporary","Cross-functional"],0,"A need plus a final objective = Purposeful."],
["\"A project involves coordinating a set of activities.\" Which characteristic is this?",["Temporary","Methodical","Purposeful","Cross-functional"],1,"Coordinating activities = Methodical."],
["A project having a defined beginning and end corresponds to which characteristic?",["Purposeful","Methodical","Temporary","Cross-functional"],2,"Beginning and end = Temporary."],
["The three dimensions of the \"quality triangle\" are:",["Cost, risk, quality","Scope, time, resources","Time, people, budget","Scope, risk, stakeholders"],1,"According to the slide: Scope (quality / perimeter), Time, Resources."],
["Which is NOT one of the three dimensions that define project performance in the course?",["Scope","Time","Resources","Stakeholders"],3,"The three dimensions are Scope, Time and Resources. Stakeholders are not one of them."],
["In the quality triangle, the scope dimension is also labelled as:",["Quality / perimeter","Budget / cost","Risk / uncertainty","Team / people"],0,"The slide shows Scope / Quality / Perimeter as one axis."],
["According to the course, a project consists of building a reality ...",["randomly and quickly","progressively and systematically","once and permanently","continuously and repetitively"],1,"Word for word: progressively and systematically building a reality."],
["In Kleim and Ludin's definition, project activities are carried out in:",["a logical sequence","random order","a continuous loop","parallel only"],0,"\"carried out in a logical sequence\"."],
["Which description best fits a project?",["A repetitive activity ensuring normal functioning","A temporary activity with a start and an end producing a unique result","A permanent department of the company","A continuous production process"],1,"Project = temporary, start and end, unique result."]
]},
/* ---------------------------------------------------------------- 1.2 */
{ id: "1.2", ch: "k1", title: "Project vs. operation, programme, portfolio",
learn: `
<p class="lead">A project creates something new and then ends. An operation keeps the existing business running and repeats.</p>
<table><tr><th>Criterion</th><th>Project</th><th>Operation</th></tr>
<tr><td>Environment</td><td>Unknown, innovative, temporary organization</td><td>Repetitive, stable organization</td></tr>
<tr><td>Process</td><td>Irreversible decisions</td><td>Reversible decisions</td></tr>
<tr><td>Uncertainty</td><td>High, exogenous variables, degrees of freedom</td><td>Low, endogenous variables, structured actions</td></tr>
<tr><td>Cash flow</td><td>Negative: you invest first, return comes later</td><td>Positive: generates profit</td></tr>
<tr><td>Activities</td><td>Creates future activities, secures the company's future</td><td>Maintains existing activities, keeps the company alive</td></tr>
<tr><td>Difficulty</td><td>Complex "leap into the unknown"</td><td>Intervening quickly in case of a bottleneck or breakdown</td></tr>
<tr><td>Example</td><td>Building a bridge</td><td>Regular maintenance of the bridge</td></tr></table>
<h3>Levels of work</h3>
<table><tr><th>Term</th><th>Definition</th></tr>
<tr><td>Project</td><td>Temporary, clear start and end, builds one specific thing</td></tr>
<tr><td>Programme</td><td>A group of connected projects managed together for a bigger strategic goal</td></tr>
<tr><td>Portfolio</td><td>The highest level: all the work, used to decide where to invest money</td></tr>
<tr><td>Operations</td><td>Daily, repetitive work that keeps the business running indefinitely</td></tr></table>
<div class="mem"><b>Signal words:</b> build, develop, design, launch, conduct a study = project. Manage, maintain, produce, every year = operation.</div>
<div class="trap"><b>Trap:</b> <i>Designing</i> a training program once is a project. <i>Training</i> new employees every year is an operation.</div>`,
q: [
["Which statement describes an operation rather than a project?",["Irreversible decisions","Negative cash flow","Low uncertainty with endogenous variables","Temporary organization"],2,"Operations: low uncertainty, endogenous variables. The other three describe projects."],
["Why is the cash flow of a project typically negative?",["Projects never generate revenue","You must invest before getting a return","Projects are always over budget","Operations absorb the profit"],1,"Project = invest first, return comes later."],
["Decisions taken within a project are described as:",["Reversible","Irreversible","Endogenous","Repetitive"],1,"Project: irreversible decisions. Operation: reversible."],
["Which example from the course illustrates an operation?",["Building a bridge","Developing a mobile app","Regular maintenance of the bridge","Conducting a market study"],2,"Building a bridge (project) vs. regular maintenance (operation)."],
["The environment of a project is described as:",["Repetitive and stable","Unknown, innovative, temporary organization","Fully predictable","Permanent and hierarchical"],1,"Project: unknown, innovative, temporary organization."],
["The typical difficulty of an operation is:",["Managing a leap into the unknown","Intervening quickly in case of a bottleneck or breakdown","Writing a business case","Building a new organization"],1,"Operation: react quickly to a bottleneck. Project: leap into the unknown."],
["Which activities does a project create, according to the comparison table?",["Activities that keep the company alive today","Future activities that secure the company's future","Daily maintenance routines","Reversible decisions"],1,"Projects create future activities. Operations keep existing ones alive."],
["An operation is best defined as:",["A temporary activity producing a unique result","A repetitive and continuous activity ensuring the normal functioning of an organization","A group of related projects","The highest level of investment decisions"],1,"Operation = repetitive, continuous, normal functioning."],
["A group of connected projects managed together for a bigger strategic goal is a:",["Portfolio","Programme","Operation","Work package"],1,"Programme = connected projects with one shared strategic goal."],
["Which level is used to decide where to invest money across all work?",["Project","Programme","Portfolio","Operations"],2,"The portfolio is the highest level, where investment decisions are made."],
["\"The daily, repetitive work that keeps the business running indefinitely\" defines:",["A project","A programme","Operations","A portfolio"],2,"Operations run indefinitely and repeat."],
["Which order goes from the broadest to the narrowest level?",["Project, Programme, Portfolio","Portfolio, Programme, Project","Programme, Portfolio, Project","Portfolio, Project, Programme"],1,"A portfolio contains programmes, a programme contains projects."],
["\"Train new employees every year\" is best classified as:",["A project, because training has a goal","An operation, because it recurs every year","A programme","A portfolio decision"],1,"\"Every year\" means recurring, so it is an operation."],
["\"Design an online training program\" is best classified as:",["An operation","A project","A portfolio","Maintenance"],1,"A one-off design with a start and an end = project."],
["\"Conduct a market study to launch a new product\" is:",["A project","An operation","A portfolio","A routine task"],0,"One-off with a concrete goal = project."],
["\"Produce cars in a factory\" is:",["A project","An operation","A programme","A work package"],1,"Series production repeats = operation."],
["\"Manage a company's customer service\" is:",["A project","An operation","A programme","A stage gate"],1,"Ongoing and repeated = operation."],
["Uncertainty in a project is characterised by:",["Low uncertainty and structured actions","High uncertainty, exogenous variables and degrees of freedom","No uncertainty","Endogenous variables only"],1,"Project: high uncertainty, exogenous variables, degrees of freedom."]
]},
/* ---------------------------------------------------------------- 1.3 */
{ id: "1.3", ch: "k1", title: "Project management: definitions, administration vs. management",
learn: `
<p class="lead">Three authors define project management. Each definition has a keyword that MCQs like to test.</p>
<table><tr><th>Author</th><th>Core idea</th><th>Keyword</th></tr>
<tr><td>Picq (2011)</td><td>Principles, methods and tools to steer and coordinate a project; strategic, organizational and human stakes; innovation and learning</td><td>human stakes</td></tr>
<tr><td>Garel (2013)</td><td>Not limited to task management; a temporary organizational mode; learning and risk management</td><td>temporary organizational mode</td></tr>
<tr><td>Kleim &amp; Ludin (1998)</td><td>Tools, techniques and processes to define, plan, organize, control and direct a project</td><td>define, plan, organize, control, direct</td></tr></table>
<h3>Administration (Gestion) vs. strategic management</h3>
<table><tr><th></th><th>Administration</th><th>Strategic management</th></tr>
<tr><td>Focus</td><td>Organization, task tracking, performance</td><td>Strategic vision, leadership, motivation</td></tr>
<tr><td>Role</td><td>Plan, execute, deliver</td><td>Inspire, anticipate, align with strategy</td></tr>
<tr><td>Tools</td><td>Gantt, Scrum, Kanban, Risk Matrix</td><td>Communication, persuasion, holistic vision</td></tr>
<tr><td>Responsibility</td><td>Deadlines, budget, resources</td><td>Stakeholder engagement, change leadership</td></tr>
<tr><td>Ultimate goal</td><td>Completing a project successfully</td><td>Project success aligned with the corporate vision</td></tr></table>
<h3>4 actions each</h3>
<p><b>Administration</b> focuses on <b>activities</b>: Estimation, Organization, Planning, Monitoring (tracking).</p>
<p><b>Strategic management</b> focuses on <b>people</b>: Mobilization (team engagement), Management (leadership), Communication, Steering (governance).</p>
<div class="trap"><b>Trap:</b> Gantt, Scrum, Kanban and the Risk Matrix are tools of administration on the slide, even though Scrum sounds "agile".</div>`,
q: [

{ id: "1.4", ch: "k1", title: "PM functions and PMBOK phases",
learn: `
<p class="lead">Project management has 6 functions and, according to PMBOK, runs through 5 phases.</p>
<h3>6 functions</h3>
<table><tr><th>Function</th><th>Core idea</th></tr>
<tr><td>Direct</td><td>Lead the project throughout its entire lifecycle</td></tr>
<tr><td>Define</td><td>Set goals so everyone agrees on the outcomes and knows how to recognize success</td></tr>
<tr><td>Plan</td><td>A roadmap people follow with confidence, not just the project manager</td></tr>
<tr><td>Organize</td><td>Increase the team's efficiency and effectiveness, resulting in greater productivity</td></tr>
<tr><td>Control</td><td>Keep momentum and direction so the project is not overtaken by "scope creep"</td></tr>
<tr><td>Close</td><td>End the project smoothly rather than in chaos</td></tr></table>
<h3>5 PMBOK phases (exactly as on the slide)</h3>
<table><tr><th>Phase</th><th>Content on the slide</th></tr>
<tr><td>Initiation</td><td>Vision, goals, objectives, scope, responsibilities, expected outcomes. <b>Requirements specification.</b></td></tr>
<tr><td>Planning</td><td>Develop the <b>WBS</b> and the project's start and completion</td></tr>
<tr><td>Execution</td><td><b>Team formation, resource allocation, cost estimation, risk assessment</b>, preparation of project documentation, ensuring effective communication</td></tr>
<tr><td>Control</td><td>Collection and evaluation of status reports, management of changes to the baseline, responding to circumstances that may negatively affect participants</td></tr>
<tr><td>Closing</td><td>Compilation of statistics, release of personnel, lessons-learned document</td></tr></table>
<div class="trap"><b>Trap:</b> General PM knowledge would put cost estimation and risk assessment in Planning. The slide puts them under <b>Execution</b>. Requirements specification is under <b>Initiation</b>. In the exam, the slide counts.</div>
<div class="mem"><b>Memory aid:</b> Planning has only two items on the slide: the WBS, and the start and completion. Anything about team, resources, cost or risk is Execution.</div>`,

["Which project management function keeps the project from being overtaken by scope creep?",["Define","Organize","Control","Close"],2,"Control keeps momentum and direction against scope creep."],
["Which function aims at a roadmap people follow with confidence, not just the project manager?",["Plan","Direct","Define","Organize"],0,"Plan = a roadmap everyone trusts."],
["Which function sets goals so that everyone agrees on the outcomes and knows how to recognize success?",["Define","Plan","Direct","Close"],0,"Define = clarify goals and success criteria."],
["Which function increases the efficiency and effectiveness of the team, resulting in greater productivity?",["Control","Organize","Close","Define"],1,"Organize = team efficiency and effectiveness."],
["Which function makes sure a project ends smoothly rather than in chaos?",["Control","Direct","Close","Plan"],2,"Close = an orderly end."],
["Which function means leading a project throughout its entire lifecycle?",["Direct","Define","Organize","Control"],0,"Direct = lead across the whole lifecycle."],
["How many project management functions are presented in the course?",["4","5","6","8"],2,"Define, Plan, Organize, Control, Direct, Close = 6."],
["According to the PMBOK phases slide, developing the work breakdown structure happens in:",["Initiation","Planning","Execution","Closing"],1,"Planning on the slide: the WBS and the project's start and completion."],
["Preparing a lessons-learned document happens in:",["Control","Execution","Planning","Closing"],3,"Closing: statistics, release of personnel, lessons learned."],
["Management of changes to the baseline belongs to:",["Initiation","Planning","Control","Closing"],2,"Control: status reports, changes to the baseline."],
["Determining the overall vision, goals, scope and expected outcomes happens in:",["Initiation","Planning","Execution","Control"],0,"Initiation."],
["According to the course slide, requirements specification belongs to:",["Initiation","Planning","Execution","Control"],0,"On the slide, requirements specification is listed under Initiation."],
["According to the course slide, team formation belongs to:",["Initiation","Planning","Execution","Closing"],2,"On the slide, team formation is listed under Execution."],
["According to the course slide, risk assessment and cost estimation belong to:",["Initiation","Planning","Execution","Closing"],2,"The slide lists cost estimation and risk assessment under Execution."],
["Release of personnel happens in:",["Execution","Control","Closing","Initiation"],2,"Closing."],
["Ensuring effective communication is listed under:",["Initiation","Planning","Execution","Closing"],2,"Execution."],
["What is the correct order of the PMBOK phases in the course?",["Initiation, Planning, Execution, Control, Closing","Planning, Initiation, Execution, Closing, Control","Initiation, Execution, Planning, Control, Closing","Planning, Execution, Initiation, Control, Closing"],0,"Initiation, Planning, Execution, Control, Closing."],
["\"Responding to circumstances that may negatively affect project participants\" belongs to:",["Initiation","Control","Closing","Planning"],1,"Control."],
["Collection and evaluation of status reports belongs to:",["Execution","Control","Closing","Initiation"],1,"Control."],
["Resource allocation is listed by the course under:",["Initiation","Planning","Execution","Closing"],2,"Execution, together with team formation and cost estimation."]

{ id: "1.5", ch: "k1", title: "Project governance and the Boeing case",
learn: `
<p class="lead">Governance is the management framework within which project decisions are made. The slide calls it a "temporary constitution" for the project.</p>
<p>It defines <b>who has the authority</b> to make decisions, <b>who is accountable</b> for outcomes and <b>how risks are managed</b>.</p>
<h3>The 3 pillars</h3>
<table><tr><th>Pillar</th><th>Content</th><th>Key question</th></tr>
<tr><td>Structure</td><td>Project sponsor, steering committee, PMO</td><td>Who?</td></tr>
<tr><td>Process</td><td>Stage gates, change control, escalation thresholds</td><td>How does it run?</td></tr>
<tr><td>Information</td><td>Status reporting, independent audits</td><td>What is reported and checked?</td></tr></table>
<h3>Case: Boeing 737 MAX</h3>
<p><b>1. Pressure:</b> In 2011 Boeing had to compete with a new Airbus plane. Management wanted to protect profits and avoid expensive flight simulator training for airlines, so it set aggressive deadlines and cut costs.</p>
<p><b>2. Deception:</b> Larger engines created an aerodynamic issue. Hidden software called MCAS was added to fix it. MCAS was not disclosed in pilot manuals. Engineers who raised safety alerts were ignored or pressured to stay silent.</p>
<p><b>3. Board breakdowns</b> (failure of the <b>Duty of Care</b>):</p>
<table><tr><th>Failure</th><th>What exactly</th></tr>
<tr><td>Financial focus</td><td>Stock buybacks and bonuses tied to the share price instead of safety</td></tr>
<tr><td>Lack of expertise</td><td>Board made up of executives from other industries, no aviation or safety experts</td></tr>
<tr><td>Information gap</td><td>No board-level safety committee, blind trust in management reports</td></tr></table>
<p><b>4. Fallout:</b> Two crashes in 2018 and 2019, a global grounding of <b>20 months</b>, billions in losses, and shareholders successfully sued the board.</p>
<div class="mem"><b>Link to the pillars:</b> Structure failed (board without expertise), Process failed (engineers' escalation blocked), Information failed (no independent reporting).</div>`,
q: [
["Project governance is described in the course as functioning like a:",["Temporary constitution for the project","Permanent operations manual","Marketing plan","Gantt chart"],0,"Temporary constitution."],
["Stage gates and escalation thresholds belong to which governance pillar?",["Structure","Process","Information","Ethics"],1,"Process: stage gates, change control, escalation thresholds."],
["Independent audits belong to which governance pillar?",["Structure","Process","Information","Sponsorship"],2,"Information: status reporting, independent audits."],
["The steering committee belongs to which governance pillar?",["Structure","Process","Information","Execution"],0,"Structure: sponsor, steering committee, PMO."],
["The PMO (project management office) belongs to which governance pillar?",["Structure","Process","Information","Closing"],0,"Structure."],
["Change control belongs to which governance pillar?",["Structure","Process","Information","Benefits"],1,"Process."],
["Status reporting belongs to which governance pillar?",["Structure","Process","Information","Scope"],2,"Information."],
["How many core pillars of governance does the course present?",["2","3","4","5"],1,"Structure, Process, Information."],
["Project governance defines:",["Who has authority to decide, who is accountable, and how risks are managed","The detailed task list","The marketing budget","The product design"],0,"Word for word from the slide."],
["In the Boeing 737 MAX case, the absence of a board-level safety committee is an example of:",["Financial focus","Information gap","Lack of expertise","Scope creep"],1,"Information gap."],
["Boeing's board was made up of executives from outside industries with no aviation safety experts. This is:",["Lack of expertise","Information gap","Financial focus","Change control"],0,"Lack of expertise."],
["Prioritising stock buybacks and bonuses linked to short-term share price is an example of:",["Information gap","Lack of expertise","Financial focus","Process failure"],2,"Financial focus."],
["Which fiduciary duty did the Boeing board fail, according to the case?",["Duty of loyalty","Duty of care","Duty of disclosure to suppliers","Duty of competition"],1,"Duty of Care."],
["What was MCAS in the Boeing case?",["A pilot training program","A hidden flight-control software added to fix an aerodynamic issue","A board committee","A new engine"],1,"MCAS = hidden flight-control software added because of the larger engines."],
["How long was the 737 MAX fleet grounded globally?",["6 months","12 months","20 months","36 months"],2,"20 months."],
["Why did Boeing rush the 737 MAX in 2011?",["To meet a regulator's deadline","To compete with a new Airbus plane","To replace a failed project","To enter the car market"],1,"Competition with a new Airbus plane."],
["Engineers who raised safety alerts were ignored or pressured to stay silent. Which governance pillar failed most directly?",["Process (escalation)","Benefits","Scope","Closing"],0,"Escalation is part of the Process pillar (escalation thresholds)."],
["Why did Boeing management avoid disclosing MCAS in pilot manuals?",["To avoid expensive flight simulator training for airlines","Because regulators forbade it","Because MCAS was not finished","To reduce engine size"],0,"They wanted to avoid simulator training to save cost and time."]
]},

{ id: "1.7", ch: "k1", title: "Strategic alignment, business case, predictive / agile / hybrid",
learn: `
<p class="lead">Strategic alignment answers the "why". The business case answers the "how" and "how much".</p>
<table><tr><th>Term</th><th>Question</th><th>Content</th></tr>
<tr><td>Strategic alignment</td><td>Why?</td><td>Proves that the project directly supports the company's long-term goals</td></tr>
<tr><td>Business case</td><td>How? How much?</td><td>Justification document: costs, financial benefits, risks, ROI</td></tr></table>
<h3>Three delivery approaches</h3>
<table><tr><th>Approach</th><th>Metaphor</th><th>Planning</th></tr>
<tr><td>Predictive</td><td>GPS route</td><td>Heavy upfront planning: every turn is mapped before you start</td></tr>
<tr><td>Agile</td><td>Open-world video game</td><td>Just in time: plan only the next sprint (about two weeks), adapt to user feedback</td></tr>
<tr><td>Hybrid</td><td>Music festival</td><td>A rigid predictive skeleton for hard deadlines (date, venue, main stage) with agile spaces for details (food trucks, setlists)</td></tr></table>
<h3>Creator studio activity</h3>
<table><tr><th>Task</th><th>Approach</th><th>Why</th></tr>
<tr><td>Soundproof booths</td><td>Predictive</td><td>Physical build, clear specification, expensive to change</td></tr>
<tr><td>YouTube channel</td><td>Agile</td><td>Uncertain outcome, driven by audience feedback</td></tr>
<tr><td>Furnishing and tech</td><td>Hybrid</td><td>Purchases can be planned, layout adapts to feedback</td></tr></table>
<div class="mem"><b>Rule of thumb:</b> The more fixed and expensive to change, the more predictive. The more uncertain and feedback-driven, the more agile. A mix of both: hybrid.</div>`,
q: [
["The document that justifies a project by weighing costs, benefits, risks and ROI is the:",["Project charter","Scope statement","Business case","WBS"],2,"Business case."],
["Strategic alignment answers which question?",["Why","How much","When","Who"],0,"Why."],
["The business case answers which questions?",["Why and who","How and how much","When and where","What and who"],1,"How and how much."],
["Which metaphor does the course use for the agile approach?",["GPS route","Open-world video game","Music festival","Building a bridge"],1,"Agile = open-world video game."],
["Which metaphor does the course use for the predictive approach?",["GPS route","Open-world video game","Music festival","Food truck"],0,"Predictive = GPS route."],
["Locking down the date, venue and main stage while keeping food trucks and setlists flexible describes:",["Predictive","Agile","Hybrid","Kanban"],2,"Hybrid = music festival."],
["Building soundproof recording booths is best managed with:",["Agile","Predictive","Hybrid","No method"],1,"Physical, fixed and expensive to change."],
["Growing the studio's YouTube channel is best managed with:",["Predictive","Agile","A fixed Gantt chart only","Operations"],1,"Uncertain and feedback-driven."],
["Furnishing the studio and setting up the tech is best managed with:",["Predictive","Agile","Hybrid","Portfolio management"],2,"Fixed purchases, flexible layout = hybrid."],
["Planning in the agile approach is described as:",["Heavy upfront mapping","Just-in-time choices for the next sprint","No planning at all","Planning only at closing"],1,"Just in time, only the next sprint."],
["Planning in the predictive approach is described as:",["Heavy upfront mapping before starting","Planning only the next two weeks","Changing plans after each user feedback","No fixed destination"],0,"Everything is planned in advance."],
["In the course, an agile sprint is given as roughly:",["Two days","Two weeks","Two months","Two years"],1,"\"plan your next two weeks (or sprint)\"."],
["Which approach builds a rigid predictive skeleton for hard deadlines and leaves agile spaces for experimentation?",["Predictive","Agile","Hybrid","Waterfall only"],2,"Hybrid."],
["Strategic alignment proves that a project:",["Is cheaper than alternatives","Directly supports the company's long-term goals","Has no risks","Is finished on time"],1,"Supports the company's long-term goals."]
]},

{ id: "1.8", ch: "k1", title: "Success criteria, benefits, ethics, sustainability",
learn: `
<p class="lead">Success criteria measure whether the targets were hit. Benefits show whether the project was worth it.</p>
<table><tr><th>Term</th><th>Key question or idea</th></tr>
<tr><td>Success criteria</td><td>Specific, measurable standards: "Did we hit our targets?"</td></tr>
<tr><td>Benefits</td><td>The actual value or long-term positive impact: "Was doing this project actually worth it?"</td></tr>
<tr><td>Ethics</td><td>Doing the right thing: professional standards, honesty, fairness, accountability</td></tr>
<tr><td>Sustainability</td><td>Not depleting resources, not harming the environment, not harming society in the long run</td></tr></table>
<h3>Example</h3>
<p>An app is delivered on time and on budget (success criteria met). One year later nobody uses it (no benefit).</p>
<div class="trap"><b>Trap:</b> "On time, on budget" is a success criterion, not a benefit. "Higher customer retention over two years" is a benefit.</div>`,
q: [
["\"Did we hit our targets?\" refers to:",["Benefits","Success criteria","Sustainability","Strategic alignment"],1,"Success criteria."],
["\"Was doing this project actually worth it?\" refers to:",["Success criteria","Benefits","Ethics","Scope"],1,"Benefits."],
["Designing a project so that it does not deplete resources or harm society in the long run is:",["Ethics","Sustainability","Governance","Benefits"],1,"Sustainability."],
["Sticking to professional standards, honesty, fairness and accountability is:",["Ethics","Sustainability","Benefits","Success criteria"],0,"Ethics."],
["A project is delivered on time and on budget, but nobody uses the product. Which statement is correct?",["Success criteria met, benefits not realised","Benefits realised, success criteria missed","Both met","Neither met"],0,"Targets met, but no value created."],
["Which of the following is a benefit rather than a success criterion?",["Delivered by 30 June","Stayed within a 50,000 budget","Customer retention increases over the next two years","All 12 features delivered"],2,"Long-term value = benefit. The others are measurable targets."],
["Which of the following is a success criterion?",["The project is delivered within its approved budget","The company becomes market leader in ten years","Employees feel more motivated","Society benefits long term"],0,"A concrete, measurable target = success criterion."],
["Boeing hiding MCAS from pilot manuals is primarily a failure of:",["Sustainability","Ethics","Scope","Network logic"],1,"Dishonesty towards pilots = an ethics failure."],
["Choosing reusable materials to reduce environmental damage in a construction project relates to:",["Ethics","Sustainability","Success criteria","Network logic"],1,"Resources and environment = sustainability."],
["Benefits are best described as:",["The measurable standards of completion","The actual value or long-term positive impact created by the project","The project's budget","The list of deliverables"],1,"Benefits = actual, long-term value."]
]},

{ id: "2.1", ch: "k2", title: "Project charter",
learn: `
<p class="lead">The project charter is the official document that brings a project to life and gives the project manager authority.</p>
<div class="def"><span>Definition</span>A project charter is an official document that authorizes the existence of a project and grants the project manager the authority to use organizational resources.</div>
<h3>Key elements</h3>
<table><tr><th>Element</th></tr>
<tr><td>Business case</td></tr><tr><td>Project purpose and objectives</td></tr><tr><td>Scope and deliverables</td></tr>
<tr><td>Stakeholders and roles</td></tr><tr><td>Milestones and budget</td></tr><tr><td>Risks, assumptions and constraints</td></tr></table>
<h3>Template (Institute of Project Management)</h3>
<p>Project title, description, project manager, level of authority, sponsor(s), project owner, product scope / deliverables, objectives, pre-assigned resources, stakeholders list, summary milestone schedule.</p>
<div class="trap"><b>Trap:</b> The charter <i>contains</i> the business case as one element. Lessons learned, float or WBS work packages do not belong in the charter.</div>`,

["The document that authorizes the existence of a project and gives the PM authority to use organizational resources is the:",["Business case","Scope statement","Project charter","Requirements document"],2,"Project charter."],

["To whom does the project charter grant authority?",["The end-users","The project manager","The suppliers","The regulators"],1,"The project manager."],
["Which of these is a key element of the project charter?",["Stakeholders and roles","Float of each activity","Release of personnel","Sprint backlog"],0,"Stakeholders and roles."],
["The charter template includes a \"summary milestone schedule\". This means the charter contains:",["A detailed CPM calculation","High-level milestones","The final lessons learned","Daily task assignments"],1,"Only a summary of the milestones."],
["\"Level of authority\" in the charter template refers to the authority of the:",["Project manager","Regulator","Customer","Supplier"],0,"It sits right next to Project Manager in the template."],
["Which element appears both as a separate document and as a key element of the charter?",["Business case","WBS","Network diagram","Lessons learned"],0,"The business case is one element of the charter."],
["Without an approved charter, the project manager:",["Lacks formal authority to use organizational resources","Can still spend any budget","Has finished initiation","Must skip planning"],0,"The charter is what grants that authority."],
["\"Pre-assigned resources\" is a field in the:",["Project charter template","Scope statement","WBS","Network diagram"],0,"Field 8 in the charter template."],
["\"Risks, assumptions and constraints\" are part of:",["The project charter","The lessons-learned document","The critical path","Operations"],0,"A key element of the charter."]

{ id: "2.2", ch: "k2", title: "Project requirements",
learn: `
<p class="lead">Requirements are the specific conditions, tasks and features a project must deliver to be considered a success.</p>
<h3>The pyramid: from top (high level) to bottom (detailed)</h3>
<table><tr><th>Level</th><th>Point of view</th><th>Content</th></tr>
<tr><td>Business requirements</td><td>Sponsor</td><td>Scope of the project, business objectives</td></tr>
<tr><td>User requirements</td><td>User</td><td>User goals, user input and output</td></tr>
<tr><td>System requirements</td><td>System</td><td>Functional: <b>what</b> the system does. Non-functional: <b>how well</b> it does it</td></tr></table>
<h3>Examples</h3>
<table><tr><th>Statement</th><th>Type</th></tr>
<tr><td>Increase online sales by 15%</td><td>Business</td></tr>
<tr><td>A customer wants to see their order history</td><td>User</td></tr>
<tr><td>The app lets users reset their password by e-mail</td><td>Functional</td></tr>
<tr><td>The page loads in under 2 seconds, 99.9% availability</td><td>Non-functional</td></tr></table>
<p>The slide with the two sneakers (high-top and low-top) shows: the same basic idea, but different requirements lead to a different product.</p>`,
q: [
["Business requirements reflect whose point of view?",["The user","The sponsor","The system","The supplier"],1,"The sponsor."],
["\"The login page loads in under 2 seconds\" is a:",["Business requirement","User requirement","Functional requirement","Non-functional requirement"],3,"How well = non-functional."],
["Functional requirements describe:",["How well the system performs","What the system does","The sponsor's objectives","The budget"],1,"What the system does."],
["User requirements focus on:",["Business objectives","User goals and user input and output","Server performance","Budget approval"],1,"User goals, input and output."],
["From high level to detailed, the order of requirement types is:",["System, user, business","Business, user, system","User, business, system","Business, system, user"],1,"Business at the top, system at the bottom."],

<tr><td>No predecessor</td><td>ES = 0</td></tr>

<tr><td>Several predecessors</td><td>ES = the <b>largest</b> EF of the predecessors</td></tr>

// ---------- utilities ----------
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LET = ["A","B","C","D"];
const QUIZ_COUNT = 20, QUIZ_LEN = 25, QUIZ_GEN = 3;

function rng(seed){ let s = seed >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
function shuffle(a, r = Math.random){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// ---------- storage ----------
const KEY = "pm-midterm-v1";
let P = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } })();
P.learn = P.learn || {}; P.quiz = P.quiz || {}; P.wrong = P.wrong || [];
function persist(){ try { localStorage.setItem(KEY, JSON.stringify(P)); } catch(e){} }

// ---------- question pool ----------
const POOL = [];
SECTIONS.forEach(s => s.q.forEach((q, i) => POOL.push({ key: s.id + "#" + i, sec: s.id, q: q[0], opts: q[1], c: q[2], why: q[3] })));
const BYKEY = Object.fromEntries(POOL.map(p => [p.key, p]));
const SEC = Object.fromEntries(SECTIONS.map(s => [s.id, s]));

// ---------- CPM generator ----------
const TEMPLATES = [
  { A: [], B: ["A"], C: ["A"], D: ["B","C"], E: ["D"] },
  { A: [], B: [], C: ["A"], D: ["A","B"], E: ["C","D"] },
  { A: [], B: ["A"], C: ["A"], D: ["B"], E: ["C","D"] },
  { A: [], B: [], C: ["A"], D: ["B"], E: ["C"], F: ["D","E"] },
  { A: [], B: ["A"], C: ["B"], D: ["A"], E: ["C","D"] },
  { A: [], B: [], C: ["A","B"], D: ["A"], E: ["C"], F: ["D","E"] }
];
function solveNet(pred, dur){
  const ids = Object.keys(pred), es = {}, ef = {};
  ids.forEach(id => { es[id] = Math.max(0, ...pred[id].map(p => ef[p])); ef[id] = es[id] + dur[id]; });
  const total = Math.max(...ids.map(id => ef[id]));
  const succ = Object.fromEntries(ids.map(id => [id, ids.filter(j => pred[j].includes(id))]));
  const lf = {}, ls = {};
  ids.slice().reverse().forEach(id => { lf[id] = succ[id].length ? Math.min(...succ[id].map(s => ls[s])) : total; ls[id] = lf[id] - dur[id]; });
  const fl = Object.fromEntries(ids.map(id => [id, ls[id] - es[id]]));
  // all start-to-end paths
  const paths = [];
  const walk = (id, path) => { const p = [...path, id]; if (!succ[id].length) paths.push(p); else succ[id].forEach(s => walk(s, p)); };
  ids.filter(id => !pred[id].length).forEach(id => walk(id, []));
  const plen = p => p.reduce((a, id) => a + dur[id], 0);
  return { ids, es, ef, ls, lf, fl, total, succ, paths: paths.map(p => ({ p, len: plen(p) })) };
}
function makeNet(r){
  for (let tries = 0; tries < 200; tries++){
    const pred = TEMPLATES[Math.floor(r() * TEMPLATES.length)];
    const dur = Object.fromEntries(Object.keys(pred).map(id => [id, 1 + Math.floor(r() * 9)]));
    const S = solveNet(pred, dur);
    const lens = S.paths.map(x => x.len).sort((a, b) => b - a);
    if (lens.length > 1 && lens[0] !== lens[1] && Object.values(S.fl).some(f => f >= 2)) return { pred, dur, S };
  }
}
function distinct(correct, cands, r){
  const out = [correct];
  for (const c of cands){ if (out.length === 4) break; if (c >= 0 && !out.includes(c)) out.push(c); }
  let k = 1; while (out.length < 4){ const c = correct + k * (out.length % 2 ? 1 : -1) + (k > 3 ? k : 0); if (c >= 0 && !out.includes(c)) out.push(c); k++; }
  return out;
}
function genQuestion(r, unit){
  const { pred, dur, S } = makeNet(r);
  const ids = S.ids;
  const net = ids.map(id => ({ id, d: dur[id], p: pred[id] }));
  const cp = S.paths.find(x => x.len === S.total).p;
  const solution = `ES/EF: ${ids.map(id => `${id} ${S.es[id]}/${S.ef[id]}`).join(", ")}. Critical path ${cp.join(", ")} = ${S.total}. Float: ${ids.map(id => `${id} ${S.fl[id]}`).join(", ")}.`;
  const merges = ids.filter(id => pred[id].length > 1);
  const nonCrit = ids.filter(id => S.fl[id] > 0);
  const types = ["duration", "merge", "float", "path", "delay"];
  const t = types[Math.floor(r() * types.length)];
  let q, vals, why;
  if (t === "duration" || (t === "merge" && !merges.length)){
    const second = S.paths.map(x => x.len).sort((a, b) => b - a)[1];
    const sumAll = ids.reduce((a, id) => a + dur[id], 0);
    vals = distinct(S.total, [second, sumAll, S.total + 1, S.total - 2], r);
    q = `What is the minimum project duration (in ${unit})?`;
    why = `The longest path sets the duration. ${solution}`;
  } else if (t === "merge"){
    const m = merges[Math.floor(r() * merges.length)];
    const efs = pred[m].map(p => S.ef[p]);
    vals = distinct(S.es[m], [Math.min(...efs), efs.reduce((a, b) => a + b, 0), S.es[m] + dur[m]], r);
    q = `What is the earliest start (ES) of activity ${m}?`;
    why = `${m} has several predecessors (${pred[m].join(", ")}), so take the largest EF: max(${efs.join(", ")}) = ${S.es[m]}. ${solution}`;
  } else if (t === "float" && nonCrit.length){
    const a = nonCrit[Math.floor(r() * nonCrit.length)];
    vals = distinct(S.fl[a], [0, S.fl[a] + dur[a], S.fl[a] + 1, S.fl[a] - 1], r);
    q = `How much float does activity ${a} have (in ${unit})?`;
    why = `Float = LS minus ES = ${S.ls[a]} minus ${S.es[a]} = ${S.fl[a]}. ${solution}`;
  } else if (t === "delay" && nonCrit.length){
    const a = nonCrit[Math.floor(r() * nonCrit.length)];
    const k = 1 + Math.floor(r() * (S.fl[a] + 3));
    const newDur = Object.assign({}, dur); newDur[a] += k;
    const nt = solveNet(pred, newDur).total;
    vals = distinct(nt, [S.total + k, S.total, nt + 1, S.total - k], r);
    q = `Activity ${a} takes ${k} ${unit} longer than planned. What is the new project duration?`;
    why = `${a} has ${S.fl[a]} ${unit} of float. ${k <= S.fl[a] ? "The delay fits within the float, so the duration stays " + S.total + "." : "The delay exceeds the float by " + (k - S.fl[a]) + ", so the new duration is " + nt + "."} ${solution}`;
  } else {
    const opts = shuffle(S.paths.map(x => x.p.join(", ")), r);
    const right = cp.join(", ");
    const others = opts.filter(o => o !== right);
    const fake = [ids.slice().join(", "), ids.filter(id => !cp.includes(id)).concat(cp.slice(-1)).join(", "), cp.slice(1).join(", ")];
    const pool = [...others, ...fake].filter((o, i, a) => o && o !== right && a.indexOf(o) === i);
    const options = [right, ...pool.slice(0, 3)];
    while (options.length < 4) options.push(ids.slice().reverse().join(", ") + " ".repeat(options.length));
    const order = shuffle([0,1,2,3], r);
    return { gen: true, sec: "2.5", net, unit, q: "Which sequence is the critical path?", opts: order.map(i => options[i].trim()), c: order.indexOf(0), why: `Find the longest path: ${S.paths.map(x => x.p.join("-") + " = " + x.len).join("; ")}. ${solution}` };
  }
  const order = shuffle([0,1,2,3], r);
  return { gen: true, sec: "2.5", net, unit, q, opts: order.map(i => String(vals[i])), c: order.indexOf(0), why };
}

// ---------- fixed quiz composition ----------
const QUIZZES = (() => {
  const target = QUIZ_LEN - QUIZ_GEN;
  const sizes = SECTIONS.map(s => s.q.length), total = sizes.reduce((a, b) => a + b, 0);
  const raw = sizes.map(n => n / total * target);
  const alloc = raw.map(Math.floor);
  let left = target - alloc.reduce((a, b) => a + b, 0);
  raw.map((x, i) => [x - Math.floor(x), i]).sort((a, b) => b[0] - a[0]).slice(0, left).forEach(([, i]) => alloc[i]++);
  const cycles = SECTIONS.map((s, i) => shuffle(s.q.map((_, j) => s.id + "#" + j), rng(1000 + i)));
  const ptr = SECTIONS.map(() => 0);
  const out = [];
  for (let k = 0; k < QUIZ_COUNT; k++){
    const keys = [];
    SECTIONS.forEach((s, i) => { for (let n = 0; n < alloc[i]; n++){ keys.push(cycles[i][ptr[i] % cycles[i].length]); ptr[i]++; } });
    out.push({ n: k + 1, keys: shuffle(keys, rng(5000 + k)), seed: 9000 + k * 7 });
  }
  return out;
})();
function buildQuizItems(qz){
  const r = rng(qz.seed);
  const items = qz.keys.map(k => BYKEY[k]);
  const gens = Array.from({ length: QUIZ_GEN }, (_, i) => genQuestion(r, i % 2 ? "days" : "weeks"));
  // spread generated questions through the quiz
  [6, 14, 21].forEach((pos, i) => items.splice(pos, 0, gens[i]));
  return items;
}
function shuffledCopy(item){
  if (item.gen) return Object.assign({}, item);
  const order = shuffle([0,1,2,3]);
  return Object.assign({}, item, { opts: order.map(i => item.opts[i]), c: order.indexOf(item.c) });
}

// ---------- views ----------
let tab = "learn";
let run = null;

function setTab(t){
  tab = t; run = null;
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
  render();
}
function scrollTop(){ window.scrollTo(0, 0); }

function render(){
  const v = $("#view");
  if (run) return renderRun(v);
  if (tab === "learn") return renderLearnHome(v);
  if (tab === "quiz") return renderQuizHome(v);
  if (tab === "wrong") return renderWrong(v);
}

function pct(a, b){ return b ? Math.round(a / b * 100) : 0; }
function badge(best){
  if (best == null) return `<span class="pill">new</span>`;
  const cls = best >= 85 ? "good" : best >= 65 ? "mid" : "low";
  return `<span class="pill ${cls}">${best}%</span>`;
}

function renderLearnHome(v){
  const done = SECTIONS.filter(s => (P.learn[s.id] || {}).best >= 80).length;
  v.innerHTML = `
    <header class="top"><p class="eyebrow">ESCA · Project Management</p><h1>Learn</h1>
    <p class="sub">Each section explains the material first and then tests you. At 80% or more it counts as mastered.</p>
    <div class="meter"><i style="width:${pct(done, SECTIONS.length)}%"></i></div>
    <p class="meta">${done} of ${SECTIONS.length} sections mastered</p></header>
    ${CHAPTERS.map(ch => `
      <section class="group"><h2>${ch.title}<small>${esc(ch.sub)}</small></h2>
      <div class="list">${SECTIONS.filter(s => s.ch === ch.id).map(s => `
        <button class="row" data-sec="${s.id}" type="button"><span class="num">${s.id}</span><span class="rt">${esc(s.title)}<small>${s.q.length} questions</small></span>${badge((P.learn[s.id] || {}).best)}</button>`).join("")}
      </div></section>`).join("")}`;
  v.querySelectorAll("[data-sec]").forEach(b => b.onclick = () => openSection(b.dataset.sec));
}

function openSection(id){
  const s = SEC[id], v = $("#view"), i = SECTIONS.indexOf(s);
  run = null;
  v.innerHTML = `
    <div class="bar"><button class="back" type="button" id="back">Overview</button><span>${s.id}</span></div>
    <article class="learn"><p class="eyebrow">Section ${s.id}</p><h1>${esc(s.title)}</h1>${s.learn}</article>
    <div class="cta"><button class="btn" id="go" type="button">Start ${s.q.length} questions on ${s.id}</button>
    ${i + 1 < SECTIONS.length ? `<button class="btn ghost" id="nx" type="button">Next: ${SECTIONS[i + 1].id}</button>` : ""}</div>`;
  $("#back").onclick = () => setTab("learn");
  $("#go").onclick = () => startRun({ kind: "learn", id, title: `${s.id} ${s.title}`, items: shuffle(POOL.filter(p => p.sec === id)).map(shuffledCopy) });
  const nx = $("#nx"); if (nx) nx.onclick = () => openSection(SECTIONS[i + 1].id);
  scrollTop();
}

function renderQuizHome(v){
  const tried = QUIZZES.filter(q => P.quiz[q.n]);
  const avg = tried.length ? Math.round(tried.reduce((a, q) => a + P.quiz[q.n].best, 0) / tried.length) : null;
  v.innerHTML = `
    <header class="top"><p class="eyebrow">Midterm Trainer</p><h1>Quizzes</h1>
    <p class="sub">20 practice exams with 25 questions each, drawn from all sections. Every quiz includes 3 newly generated CPM calculations.</p>
    <p class="meta">${tried.length} of 20 done${avg != null ? ` · average best score ${avg}%` : ""}</p></header>
    <div class="grid">${QUIZZES.map(q => { const r = P.quiz[q.n]; return `
      <button class="tile ${r ? (r.best >= 85 ? "good" : r.best >= 65 ? "mid" : "low") : ""}" data-q="${q.n}" type="button"><span class="tn">${q.n}</span><span class="ts">${r ? r.best + "%" : "new"}</span><span class="tt">${r ? r.tries + "×" : "25 questions"}</span></button>`; }).join("")}</div>
    <button class="btn ghost wide" id="rand" type="button">Random quiz from the whole pool</button>`;
  v.querySelectorAll("[data-q]").forEach(b => b.onclick = () => {
    const qz = QUIZZES[b.dataset.q - 1];
    startRun({ kind: "quiz", n: qz.n, title: `Quiz ${qz.n}`, items: buildQuizItems(qz).map(shuffledCopy) });
  });
  $("#rand").onclick = () => {
    const r = rng(Date.now() & 0xffffffff);
    const items = shuffle(POOL).slice(0, QUIZ_LEN - QUIZ_GEN).map(shuffledCopy);
    [5, 13, 20].forEach((pos, i) => items.splice(pos, 0, genQuestion(r, i % 2 ? "days" : "weeks")));
    startRun({ kind: "random", title: "Random quiz", items });
  };
}

function renderWrong(v){
  const keys = P.wrong.filter(k => BYKEY[k]);
  const bySec = {};
  keys.forEach(k => { const s = BYKEY[k].sec; bySec[s] = (bySec[s] || 0) + 1; });
  v.innerHTML = `
    <header class="top"><p class="eyebrow">Mistake training</p><h1>Open mistakes</h1>
    <p class="sub">Every question you get wrong lands here. Answer it correctly and it disappears.</p></header>
    ${keys.length ? `
      <div class="big">${keys.length}<small>questions open</small></div>
      <div class="list">${Object.keys(bySec).sort().map(s => `<button class="row" data-sec="${s}" type="button"><span class="num">${s}</span><span class="rt">${esc(SEC[s].title)}<small>Read the explanation again</small></span><span class="pill low">${bySec[s]}</span></button>`).join("")}</div>
      <button class="btn wide" id="go" type="button">Practise all ${keys.length} mistakes</button>
      <button class="btn ghost wide" id="clr" type="button">Clear list</button>
      <p class="hint" id="clrHint" hidden>Tap again to confirm.</p>`
    : `<div class="empty"><p><b>No open mistakes.</b></p><p>Do a section or a quiz. Questions you get wrong will collect here.</p></div>`}`;
  v.querySelectorAll("[data-sec]").forEach(b => b.onclick = () => { tab = "learn"; document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.tab === "learn"))); openSection(b.dataset.sec); });
  const go = $("#go"); if (go) go.onclick = () => startRun({ kind: "wrong", title: "Mistake training", items: shuffle(keys.map(k => BYKEY[k])).map(shuffledCopy) });
  const clr = $("#clr"); if (clr){ let armed = false; clr.onclick = () => { if (!armed){ armed = true; $("#clrHint").hidden = false; clr.textContent = "Really clear"; return; } P.wrong = []; persist(); render(); }; }
}

// ---------- run engine ----------
function startRun(cfg){
  run = Object.assign({ idx: 0, ok: 0, log: [], answered: false }, cfg);
  render(); scrollTop();
}
function netTable(it){
  return `<div class="nett"><table><tr><th>Activity</th><th>Duration (${it.unit})</th><th>Predecessors</th></tr>${it.net.map(n => `<tr><td>${n.id}</td><td>${n.d}</td><td>${n.p.length ? n.p.join(", ") : "none"}</td></tr>`).join("")}</table></div>`;
}
function renderRun(v){
  if (run.idx >= run.items.length) return renderResult(v);
  const it = run.items[run.idx], n = run.items.length;
  v.innerHTML = `
    <div class="bar"><button class="back" type="button" id="quit">Quit</button><span>${esc(run.title)}</span></div>
    <div class="prog"><i style="width:${pct(run.idx, n)}%"></i></div>
    <div class="qhead"><span>Question ${run.idx + 1} / ${n}</span><span>${it.gen ? "CPM calculation" : esc(it.sec + " " + SEC[it.sec].title)}</span></div>
    ${it.gen ? netTable(it) : ""}
    <p class="q">${esc(it.q)}</p>
    <div class="opts">${it.opts.map((o, i) => `<button class="opt" type="button" data-i="${i}"><span class="k">${LET[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>
    <div id="fb"></div>
    <div class="cta"><button class="btn" id="next" type="button" hidden>Next</button></div>
    <p class="hint score">${run.ok} of ${run.idx} correct</p>`;
  v.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.i));
  $("#next").onclick = () => { run.idx++; run.answered = false; render(); scrollTop(); };
  let armed = false;
  $("#quit").onclick = () => { if (!armed){ armed = true; $("#quit").textContent = "Really quit?"; return; } const t = run.kind === "learn" ? "learn" : run.kind === "wrong" ? "wrong" : "quiz"; run = null; setTab(t); };
}
function answer(i){
  if (run.answered) return;
  run.answered = true;
  const it = run.items[run.idx], right = i === it.c;
  document.querySelectorAll(".opt").forEach((b, j) => { b.disabled = true; if (j === it.c) b.classList.add("right"); else if (j === i) b.classList.add("wrong"); });
  if (right) run.ok++;
  run.log.push({ it, picked: i, right });
  if (!it.gen){
    const at = P.wrong.indexOf(it.key);
    if (right && at >= 0) P.wrong.splice(at, 1);
    if (!right && at < 0) P.wrong.push(it.key);
    persist();
  }
  $("#fb").innerHTML = `<div class="why ${right ? "" : "bad"}"><b>${right ? "Correct." : "Wrong. The answer is " + LET[it.c] + ": " + esc(it.opts[it.c])}</b><span>${esc(it.why)}</span></div>`;
  const n = $("#next"); n.hidden = false; n.textContent = run.idx + 1 < run.items.length ? "Next" : "See results"; n.focus({ preventScroll: true });
  $(".score").textContent = `${run.ok} of ${run.idx + 1} correct`;
}
function renderResult(v){
  const n = run.items.length, p = pct(run.ok, n);
  if (run.kind === "learn"){ const r = P.learn[run.id] || {}; r.best = Math.max(r.best || 0, p); r.last = p; P.learn[run.id] = r; }
  if (run.kind === "quiz"){ const r = P.quiz[run.n] || { tries: 0 }; r.best = Math.max(r.best || 0, p); r.last = p; r.tries++; P.quiz[run.n] = r; }
  persist();
  const bySec = {};
  run.log.forEach(l => { const s = l.it.sec; bySec[s] = bySec[s] || { n: 0, ok: 0 }; bySec[s].n++; if (l.right) bySec[s].ok++; });
  const weak = Object.keys(bySec).filter(s => bySec[s].ok / bySec[s].n < 0.7).sort();
  const misses = run.log.filter(l => !l.right);
  const verdict = p >= 85 ? "Solid. This level is enough for the exam." : p >= 65 ? "Good base. Review the weak sections below." : "Gaps left. Reread the weak sections and practise your mistakes.";
  const kind = run.kind, sid = run.id, qn = run.n;
  v.innerHTML = `
    <div class="bar"><button class="back" type="button" id="done">Done</button><span>${esc(run.title)}</span></div>
    <div class="result"><div class="big">${p}%<small>${run.ok} of ${n} correct</small></div><p>${verdict}</p></div>
    ${kind !== "learn" ? `<table class="brk"><tr><th>Section</th><th>Correct</th></tr>${Object.keys(bySec).sort().map(s => `<tr class="${weak.includes(s) ? "weak" : ""}"><td>${s} ${esc(SEC[s].title)}</td><td class="n">${bySec[s].ok} / ${bySec[s].n}</td></tr>`).join("")}</table>` : ""}
    ${weak.length && kind !== "learn" ? `<div class="list">${weak.map(s => `<button class="row" data-sec="${s}" type="button"><span class="num">${s}</span><span class="rt">${esc(SEC[s].title)}<small>Weak, read the explanation</small></span></button>`).join("")}</div>` : ""}
    <div class="cta">
      ${misses.length ? `<button class="btn" id="rm" type="button">Retry these ${misses.length} mistakes now</button>` : ""}
      ${kind === "learn" && SECTIONS.indexOf(SEC[sid]) + 1 < SECTIONS.length ? `<button class="btn ${misses.length ? "ghost" : ""}" id="nx" type="button">Next: ${SECTIONS[SECTIONS.indexOf(SEC[sid]) + 1].id}</button>` : ""}
      ${kind === "quiz" && qn < QUIZ_COUNT ? `<button class="btn ${misses.length ? "ghost" : ""}" id="nq" type="button">Start quiz ${qn + 1}</button>` : ""}
    </div>
    ${misses.length ? `<h2 class="rh">Your mistakes</h2><div class="miss">${misses.map(l => `<div>${l.it.gen ? netTable(l.it) : ""}<p>${esc(l.it.q)}</p><p class="a"><b>Correct:</b> ${esc(l.it.opts[l.it.c])}. ${esc(l.it.why)}</p></div>`).join("")}</div>` : ""}`;
  const back = kind === "learn" ? "learn" : kind === "wrong" ? "wrong" : "quiz";
  $("#done").onclick = () => setTab(back);
  v.querySelectorAll("[data-sec]").forEach(b => b.onclick = () => { run = null; tab = "learn"; document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.tab === "learn"))); openSection(b.dataset.sec); });
  const rm = $("#rm"); if (rm) rm.onclick = () => startRun({ kind: "wrong", title: "Retry mistakes", items: misses.map(l => shuffledCopy(l.it)) });
  const nx = $("#nx"); if (nx) nx.onclick = () => { run = null; openSection(SECTIONS[SECTIONS.indexOf(SEC[sid]) + 1].id); };
  const nq = $("#nq"); if (nq) nq.onclick = () => { const qz = QUIZZES[qn]; startRun({ kind: "quiz", n: qz.n, title: `Quiz ${qz.n}`, items: buildQuizItems(qz).map(shuffledCopy) }); };
  run = null;
  scrollTop();
}

// keyboard support for desktop
document.addEventListener("keydown", e => {
  if (!run || run.idx >= run.items.length) return;
  const m = { "1":0, "2":1, "3":2, "4":3, "a":0, "b":1, "c":2, "d":3 };
  const k = e.key.toLowerCase();
  if (!run.answered && k in m){ answer(m[k]); e.preventDefault(); }
  else if (run.answered && k === "enter"){ $("#next").click(); e.preventDefault(); }
});

document.querySelectorAll(".tab").forEach(b => b.onclick = () => setTab(b.dataset.tab));
render();

if ("serviceWorker" in navigator && location.protocol === "https:" && !/claude/.test(location.hostname)){
  try { navigator.serviceWorker.register("./sw.js").catch(() => {}); } catch(e){}
}

</script>
</body>
</html>
